name: Universal Fast RDP
on: workflow_dispatch

jobs:
  general-purpose:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🚀 System Speed-Up
        shell: powershell
        run: |
          # Performance Mode: Visual effects off karein taake RDP lag na kare
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask" -Value ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00))
          
          # Virtual Memory (RAM) ko "Charge" karein
          $sys = Get-CimInstance Win32_ComputerSystem
          Set-CimInstance -InputObject $sys -Property @{AutomaticManagedPagefile = $False}
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=4096; MaximumSize=8192} -ErrorAction SilentlyContinue

      - name: 🛡️ Network Setup (Tailscale)
        shell: powershell
        run: |
          # Tailscale install aur connect karna
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i ts.msi /quiet /norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=General-Worker
          Write-Host "Connected! IP Address is:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: 🛠️ Install Basic Apps (Fast Mode)
        shell: powershell
        run: |
          # Choco ke zariye zaroori apps auto-install
          choco install googlechrome vlc qbittorrent vscode -y

      - name: 🔑 Secure User Creation
        shell: powershell
        run: |
          # RDP Permission aur User settings
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $Pass = ConvertTo-SecureString "GeneralUser786!" -AsPlainText -Force
          New-LocalUser "AdminUser" -Password $Pass -Description "General RDP Admin"
          Add-LocalGroupMember -Group "Administrators" -Member "AdminUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "AdminUser"

      - name: 🌐 Live Session
        shell: powershell
        run: |
          Write-Host "--- LOGIN INFO ---"
          Write-Host "Username: AdminUser"
          Write-Host "Password: GeneralUser786!"
          Write-Host "Machine is live for 6 hours."
          Start-Sleep -Seconds 21600
