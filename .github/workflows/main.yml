name: Supercharged Windows RDP
on: workflow_dispatch

jobs:
  rdp-session:
    runs-on: windows-latest
    steps:
      - name: 🚀 Optimize System (Charging RAM)
        shell: powershell
        run: |
          # Disable Visual Effects to speed up RDP
          $mask = [byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "UserPreferencesMask" -Value $mask
          
          # Modern PageFile Setup (Replaces broken wmic)
          $sys = Get-CimInstance Win32_ComputerSystem
          Set-CimInstance -InputObject $sys -Property @{AutomaticManagedPagefile = $False}
          New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name="C:\pagefile.sys"; InitialSize=8192; MaximumSize=16384} -ErrorAction SilentlyContinue

      - name: 🛡️ Install Tailscale (Native Windows)
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.msi" -OutFile "ts.msi"
          Start-Process msiexec.exe -ArgumentList "/i ts.msi /quiet /norestart" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=Premiere-Workstation
          Write-Host "Tailscale IP:"
          & "C:\Program Files\Tailscale\tailscale.exe" ip -4

      - name: 🔑 Configure Secure RDP & User
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Create High-Performance User
          $Pass = ConvertTo-SecureString "AdobeTester77!" -AsPlainText -Force
          $User = New-LocalUser "PowerUser" -Password $Pass -Description "RDP Admin"
          Add-LocalGroupMember -Group "Administrators" -Member "PowerUser"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "PowerUser"

      - name: ⚡ Pre-load Adobe Installer
        shell: powershell
        run: |
          $Desktop = [Environment]::GetFolderPath("Desktop")
          Invoke-WebRequest -Uri "https://ccmdls.adobe.com/AdobeProducts/KCCC/CCD/5_9_0/win64/Creative_Cloud_Set-Up.exe" -OutFile "$Desktop\Install_Adobe.exe"

      - name: ⏳ Keep Alive (8 Hours)
        shell: powershell
        run: Start-Sleep -Seconds 21600
